spring.application.name=pdf-listo
# Version del pom.xml (Maven la reemplaza al compilar); se muestra en Ayuda > Acerca de
app.version=@project.version@
# Aplicacion de escritorio: sin servidor web y sin internet
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos local (historial, recientes, recetas, perfiles).
# "app.datos" es la carpeta %APPDATA%\PDFListo; la crea CarpetaDatos al arrancar.
spring.datasource.url=jdbc:sqlite:${app.datos:.}/pdflisto.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Registro de errores en %APPDATA%\PDFListo\logs\pdflisto.log
logging.file.name=${app.datos:.}/logs/pdflisto.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=5
# Tope total del registro (nunca llena el disco aunque algo escriba de mas)
logging.logback.rollingpolicy.total-size-cap=30MB
logging.level.root=WARN
logging.level.pe.pdflisto=INFO
# PDFBox avisa mucho sobre PDF imperfectos pero legibles; solo interesan los errores
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR
# Avisos de estilos de JavaFX: no afectan al usuario y pueden repetirse miles de veces
logging.level.javafx.css=ERROR
