<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Segoe UI, Arial, sans-serif"><title>Casos de uso de PDF Listo</title><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect width="1200" height="780" fill="#ffffff"/><text x="600" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2328">PDF Listo — diagrama de casos de uso</text><rect x="120" y="56" width="960" height="680" rx="14" fill="#f6f8fa" stroke="#8c959f"/><text x="136" y="80" font-size="13" font-weight="bold" fill="#57606a">Sistema PDF Listo</text><ellipse cx="300" cy="120" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="300" y="124" text-anchor="middle" font-size="12" fill="#1f2328">Abrir y ver PDF</text><ellipse cx="300" cy="182" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="300" y="186" text-anchor="middle" font-size="12" fill="#1f2328">Organizar páginas</text><ellipse cx="300" cy="244" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="300" y="248" text-anchor="middle" font-size="12" fill="#1f2328">Comprimir, numerar, marca de agua</text><ellipse cx="300" cy="306" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="300" y="310" text-anchor="middle" font-size="12" fill="#1f2328">Anotar y firmar</text><ellipse cx="300" cy="368" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="300" y="372" text-anchor="middle" font-size="12" fill="#1f2328">Llenar formulario</text><ellipse cx="300" cy="430" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="300" y="434" text-anchor="middle" font-size="12" fill="#1f2328">Hacer buscable (OCR)</text><ellipse cx="300" cy="492" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="300" y="496" text-anchor="middle" font-size="12" fill="#1f2328">Tachar datos sensibles</text><ellipse cx="300" cy="554" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="300" y="558" text-anchor="middle" font-size="12" fill="#1f2328">Pedir con palabras</text><ellipse cx="900" cy="120" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="900" y="124" text-anchor="middle" font-size="12" fill="#1f2328">Proteger y limpiar metadatos</text><ellipse cx="900" cy="182" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="900" y="186" text-anchor="middle" font-size="12" fill="#1f2328">Validar perfil de entrega</text><ellipse cx="900" cy="244" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="900" y="248" text-anchor="middle" font-size="12" fill="#1f2328">Usar o aprender receta</text><ellipse cx="900" cy="306" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="900" y="310" text-anchor="middle" font-size="12" fill="#1f2328">Convertir (imágenes, texto, Word)</text><ellipse cx="900" cy="368" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="900" y="372" text-anchor="middle" font-size="12" fill="#1f2328">Leer facturas a Excel</text><ellipse cx="900" cy="430" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="900" y="434" text-anchor="middle" font-size="12" fill="#1f2328">Deshacer / recuperar trabajo</text><ellipse cx="900" cy="492" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="900" y="496" text-anchor="middle" font-size="12" fill="#1f2328">Comprobar componentes</text><ellipse cx="900" cy="554" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="900" y="558" text-anchor="middle" font-size="12" fill="#1f2328">Guardar copia</text><ellipse cx="470" cy="680" rx="125.0" ry="24" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><