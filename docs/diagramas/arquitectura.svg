<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Arial, sans-serif"><title>Arquitectura de PDF Listo</title><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect width="1200" height="800" fill="#ffffff"/><text x="600" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2328">PDF Listo — arquitectura (todo local, sin internet)</text><rect x="20" y="50" width="1160" height="130" rx="12" fill="#ddf4ff" stroke="none"/><text x="36" y="72" font-size="14" font-weight="bold" fill="#1f2328">1. Interfaz (JavaFX + AtlantaFX, FXML)</text><rect x="40" y="82" width="260" height="84" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="170.0" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">HAMainController (ventana)</text><text x="170.0" y="120" text-anchor="middle" font-size="11" fill="#424a53">visor, miniaturas, barra, atajos</text><text x="170.0" y="135" text-anchor="middle" font-size="11" fill="#424a53">implementa HAEditor</text><rect x="320" y="82" width="270" height="84" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="455.0" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Paneles</text><text x="455.0" y="120" text-anchor="middle" font-size="11" fill="#424a53">Pedido · Anotar · Formulario</text><text x="455.0" y="135" text-anchor="middle" font-size="11" fill="#424a53">Entrega · Tachado · Historial</text><rect x="610" y="82" width="270" height="84" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="745.0" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Formularios y menús</text><text x="745.0" y="120" text-anchor="middle" font-size="11" fill="#424a53">Herramientas · Convertir · Ayuda</text><text x="745.0" y="135" text-anchor="middle" font-size="11" fill="#424a53">HABienvenida · HAVentanaFacturas</text><rect x="900" y="82" width="260" height="84" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="1030.0" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">ui</text><text x="1030.0" y="120" text-anchor="middle" font-size="11" fill="#424a53">HAVisorPagina · HAMiniaturas</text><text x="1030.0" y="135" text-anchor="middle" font-size="11" fill="#424a53">HANotificador · HAExportador</text><rect x="20" y="200" width="1160" height="300" rx="12" fill="#fff8c5" stroke="none"/><text x="36" y="222" font-size="14" font-weight="bold" fill="#1f2328">2. Lógica de PDF Listo (Spring: inyección de dependencias)</text><rect x="40" y="232" width="265" height="100" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="172.5" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">interprete</text><text x="172.5" y="270" text-anchor="middle" font-size="11" fill="#424a53">HAInterpretePedidos (reglas)</text><text x="172.5" y="285" text-anchor="middle" font-size="11" fill="#424a53">HAPaso → HAEjecutorPlan</text><text x="172.5" y="300" text-anchor="middle" font-size="11" fill="#424a53">lista cerrada de HAAccion</text><rect x="325" y="232" width="265" height="100" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="457.5" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">operaciones</text><text x="457.5" y="270" text-anchor="middle" font-size="11" fill="#424a53">HAMotorPdf + HAOperacionPdf</text><text x="457.5" y="285" text-anchor="middle" font-size="11" fill="#424a53">HARotar, HAUnir, HAComprimir,</text><text x="457.5" y="300" text-anchor="middle" font-size="11" fill="#424a53">HANumerar, HAMarcaDeAgua…</text><rect x="610" y="232" width="265" height="100" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="742.5" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">edicion</text><text x="742.5" y="270" text-anchor="middle" font-size="11" fill="#424a53">HASesionEdicion (versiones</text><text x="742.5" y="285" text-anchor="middle" font-size="11" fill="#424a53">= deshacer/rehacer)</text><text x="742.5" y="300" text-anchor="middle" font-size="11" fill="#424a53">HADiarioSesion, HARecuperacion</text><rect x="895" y="232" width="265" height="100" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="1027.5" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">verificacion</text><text x="1027.5" y="270" text-anchor="middle" font-size="11" fill="#424a53">HAVerificador relee el</text><text x="1027.5" y="285" text-anchor="middle" font-size="11" fill="#424a53">resultado → Informe</text><text x="1027.5" y="300" text-anchor="middle" font-size="11" fill="#424a53">HAInformePdf (OpenPDF)</text><rect x="40" y="350" width="265" height="72" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="172.5" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">privacidad</text><text x="172.5" y="388" text-anchor="middle" font-size="11" fill="#424a53">HADetectorDatos, HATachar,</text><text x="172.5" y="403" text-anchor="middle" font-size="11" fill="#424a53">HAVerificadorTachado, HAProteger</text><rect x="325" y="350" width="265" height="72" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="457.5" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">anotaciones · formularios</text><text x="457.5" y="388" text-anchor="middle" font-size="11" fill="#424a53">HAAnotar, HABibliotecaFirmas,</text><text x="457.5" y="403" text-anchor="middle" font-size="11" fill="#424a53">HARellenarFormulario</text><rect x="610" y="350" width="265" height="72" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="742.5" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">ocr · facturas · conversiones</text><text x="742.5" y="388" text-anchor="middle" font-size="11" fill="#424a53">HAReconocerTexto, HALectorFacturas,</text><text x="742.5" y="403" text-anchor="middle" font-size="11" fill="#424a53">HAExportadorFacturas, HAConversor</text><rect x="895" y="350" width="265" height="72" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="1027.5" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">entrega · sistema</text><text x="1027.5" y="388" text-anchor="middle" font-size="11" fill="#424a53">Perfiles, Recetas, HAPatronNombre,</text><text x="1027.5" y="403" text-anchor="middle" font-size="11" fill="#424a53">HAComprobadorComponentes</text><rect x="40" y="436" width="1120" height="50" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="600.0" y="456" text-anchor="middle" font-size="12"  fill="#1f2328">pdf: HAPdfService · HACargaPdf · HADocumentoPdf (hilo propio) · HAEscrituraSegura (temporal → reabrir → renombrar) · HALectorTexto</text><rect x="20" y="520" width="1160" height="120" rx="12" fill="#dafbe1" stroke="none"/><text x="36" y="542" font-size="14" font-weight="bold" fill="#1f2328">3. Motores y bibliotecas (dentro de la app)</text><rect x="40" y="552" width="210" height="70" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="145.0" y="572" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Apache PDFBox 3</text><text x="145.0" y="590" text-anchor="middle" font-size="11" fill="#424a53">leer, dibujar, modificar</text><rect x="266" y="552" width="210" height="70" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="371.0" y="572" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Tesseract 5 (Tess4J)</text><text x="371.0" y="590" text-anchor="middle" font-size="11" fill="#424a53">OCR, DLL en native\</text><rect x="492" y="552" width="210" height="70" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="597.0" y="572" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">ZXing</text><text x="597.0" y="590" text-anchor="middle" font-size="11" fill="#424a53">códigos QR</text><rect x="718" y="552" width="210" height="70" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="823.0" y="572" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">OpenPDF · Apache POI</text><text x="823.0" y="590" text-anchor="middle" font-size="11" fill="#424a53">informes · Excel</text><rect x="944" y="552" width="210" height="70" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/><text x="1049.0" y="572" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">LibreOffice (opcional)</text><text x="1049.0" y="590" text-anchor="middle" font-size="11" fill="#424a53">externo: Word → PDF</text><rect x="20" y="660" width="1160" height="120" rx="12" fill="#f6f8fa" stroke="none"/><text x="36" y="682" font-size="14" font-weight="bold" fill="#1f2328">4. Datos (en el equipo del usuario)</text><rect x="40" y="692" width="360" height="72" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="220.0" y="712" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">SQLite (pdflisto.db, JPA)</text><text x="220.0" y="730" text-anchor="middle" font-size="11" fill="#424a53">historial · recientes · recetas</text><text x="220.0" y="745" text-anchor="middle" font-size="11" fill="#424a53">perfiles · reglas de detección</text><rect x="420" y="692" width="360" height="72" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="600.0" y="712" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">%APPDATA%\PDFListo</text><text x="600.0" y="730" text-anchor="middle" font-size="11" fill="#424a53">config.properties · logs · firmas</text><text x="600.0" y="745" text-anchor="middle" font-size="11" fill="#424a53">trabajo\ (versiones + diario) · tessdata</text><rect x="800" y="692" width="360" height="72" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/><text x="980.0" y="712" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2328">Archivos del usuario</text><text x="980.0" y="730" text-anchor="middle" font-size="11" fill="#424a53">original: SOLO LECTURA</text><text x="980.0" y="745" text-anchor="middle" font-size="11" fill="#424a53">resultado: siempre un archivo nuevo</text><line x1="600" y1="166" x2="600" y2="230" stroke="#57606a" stroke-width="1.4" marker-end="url(#punta)"/><text x="606.0" y="198.0" font-size="11" fill="#57606a">llama a</text><line x1="600" y1="486" x2="600" y2="550" stroke="#57606a" stroke-width="1.4" marker-end="url(#punta)"/><text x="606.0" y="518.0" font-size="11" fill="#57606a">usa</text><line x1="258" y1="486" x2="258" y2="690" stroke="#57606a" stroke-width="1.4" marker-end="url(#punta)" stroke-dasharray="5 4"/><line x1="936" y1="486" x2="936" y2="690" stroke="#57606a" stroke-width="1.4" marker-end="url(#punta)" stroke-dasharray="5 4"/></svg>
